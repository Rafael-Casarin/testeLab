services:
  - type: web
    name: lableaf-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: lableaf-postgres
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: SESSION_DAYS
        value: "30"
      - key: RESET_TOKEN_MINUTES
        value: "30"
      - key: RETURN_RESET_TOKEN
        value: "true"
      - key: AI_API_URL
        value: https://schr4y-lableaf-api.hf.space/predict

databases:
  - name: lableaf-postgres
    plan: free
    databaseName: lableaf
    user: lableaf
